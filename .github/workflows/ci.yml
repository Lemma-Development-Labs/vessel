name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      # Pinned, not `stable`. Gas accounting changes between Foundry releases,
      # so an unpinned toolchain silently moves the baseline that
      # `forge snapshot --check` measures against — the snapshot gate then fails
      # on a release nobody asked for, with no contract change behind it.
      # Bump this deliberately, regenerating .gas-snapshot in the same commit.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      # foundry.toml pins solc 0.8.24. On a cold runner svm must fetch it, so
      # --offline cannot be used; cache the download instead so runs stay fast.
      - name: cache solc (svm)
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-solc-0.8.24
      - name: fmt
        run: forge fmt --check
      - name: test (25k fuzz)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --fuzz-runs 25000
      - name: gas snapshot (±10%)
        run: forge snapshot --check --tolerance 10 --no-match-test 'testFuzz' --no-match-path 'test/fork/*'
      - name: contract sizes
        working-directory: .
        run: node scripts/check-sizes.mjs
      - name: coverage
        run: |
          mkdir -p coverage
          forge coverage --ir-minimum --report lcov --report-file coverage/lcov.info --no-match-coverage 'PerplVenue|script/' || forge coverage --report lcov --report-file coverage/lcov.info --no-match-coverage 'PerplVenue|script/'
      - name: coverage gate ≥95%
        working-directory: .
        run: node scripts/coverage-gate.mjs contracts/coverage/lcov.info
      - name: slither
        run: |
          python3 -m pip install --user slither-analyzer
          export PATH="$HOME/.local/bin:$PATH"
          slither . --fail-none

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: unit tests (Rule 0 + exit flow)
        run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  packages:
    # Shared schema source and environment guards (docs/ARCHITECTURE.md
    # decision 2). Each package is standalone with its own lockfile.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [domain, config]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # config's lint imports the shared money rules from packages/domain.
      - name: install domain (shared lint rules)
        if: matrix.pkg == 'config'
        working-directory: packages/domain
        run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: lint (bans JavaScript Number in economic code)
        run: pnpm lint

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: vendored packages match their source
        run: node scripts/sync-packages.mjs --check
      - name: install
        working-directory: vessel-service
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: vessel-service
        run: pnpm typecheck
      - name: auth tests (SIWE, sessions, invitations; real Postgres via PGlite)
        working-directory: vessel-service
        run: pnpm test

  e2e:
    # Real browser (Chromium) against the real app and vessel-service. Needs
    # the public Monad testnet RPC: the service checks its chain ID at startup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install service
        working-directory: vessel-service
        run: pnpm install --frozen-lockfile
      - name: install app
        working-directory: app
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: onboarding journey (desktop + 360 px)
        working-directory: app
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: app/test-results
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: scanner self-test (must catch a planted key)
        run: node scripts/check-secrets.test.mjs
      - run: node scripts/check-secrets.mjs
